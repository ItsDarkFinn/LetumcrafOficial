# Se crea automáticamente al instalar el plugin. El día 1 comienza en ese instante.
start-epoch-millis: 0

# Puerta debug B2: los comandos /pd nucleo/esquirla/sello/mascara/cartucho/filtro exigen
# AMBOS permiso 'permadeath.debug' (default false) Y debug-commands:true. Sin esto, los
# ítems entran solo por cofres, Cacería, Fortaleza, Caída del Sol, Fosa y Banco.
debug-commands: false

# 0 = seguir el calendario real. Un valor mayor fuerza ese día para pruebas/eventos.
manual-day-override: 0

permadeath:
  enabled: true
  ban-reason: "Has muerto. Tu partida de Permadeath ha terminado."

death-marker:
  enabled: true
  # Si el sitio exacto está ocupado o es peligroso, busca una superficie segura cercana.
  search-radius: 4

reserve:
  enabled: true
  unlock-day: 20
  filter-duration-minutes: 10
  chest-chance-per-chunk: 0.16
  # Sello de bedrock: el generador coloca losa continua en minY y tapa sobre el
  # techo real de caverna (roof+3) solo en chunks NUEVOS. No hay regeneración
  # automática: los chunks existentes de Letumcraft_Reserva_v7 no se tocan.
  # La migración a mundos existentes es manual y acotada (copia con backup),
  # nunca automática al arrancar.
  portal:
    enabled: true
    # Busca una zona natural sin construcciones ni agua dentro de este radio desde el spawn.
    search-radius-blocks: 128

resurrection-ritual:
  enabled: true
  duration-seconds: 30
  participant-radius: 5.0
  waves: 3
  wave-interval-seconds: 10
  leaver-penalty-seconds: 3600

random-events:
  enabled: true
  minimum-online-players: 15
  # Probabilidad por cada revisión nocturna (una revisión cada 30 segundos).
  night-check-chance: 0.15
  # Solo afecta al comando /pd evento iniciar.
  test-duration-seconds: 600
  dungeon-core-enabled: true
  dungeon-core-chance: 0.05
  last-auto-event-day: 0
  caravan:
    enabled: true
    start-day: 1
    interval-days: 2
    # Una sola tirada por noche mientras haya jugadores vivos en el Overworld.
    night-check-chance: 0.10
    core-chance: 0.25
    rare-loot-chance: 0.01
    last-spawn-day: 0
  nether:
    start-day: 20
    cooldown-days: 3
    last-event-day: 0
    fortress-hunt:
      enabled: true
      start-day: 10
      last-day: 0
      duration-seconds: 600
      core-chance: 0.10
      netherite-chance: 0.10
    cursed-striders:
      enabled: true
      start-day: 10
      chance: 0.10
    ashstorm:
      enabled: true
      daily-chance: 0.15
      duration-seconds: 300
      wave-interval-seconds: 30
      blazes-per-wave: 4
      ghasts-per-wave: 2
      max-active-mobs: 20
      darkness-interval-seconds: 15
      darkness-duration-seconds: 10
      effect-radius: 80.0

messages:
  prefix: "&8[&cLetumcrafOficial&8] &r"

# Cada fase puede desactivarse en juego con /pd fase <día> off.
# El valor omitido se considera activado.
phases:
  10:
    enabled: true
  20:
    enabled: true
    bats:
      book-drop-chance: 0.05
    pale-warden:
      enabled: true
  25:
    enabled: true
  35:
    enabled: true
    end-threats:
      electric-creepers:
        enabled: true
        # Un creeper electrico por cada N endermans generados naturalmente en el End.
        endermans-per-creeper: 5
      elytra-guardian:
        enabled: true
        armored-shulker-chance: 0.25
  # Fases 40/100: el plugin NO impone tormenta periódica; /weather clear del
  # operador persiste. Solo aparecen invasores de superficie (fase 40) y la
  # lluvia ácida cae únicamente bajo lluvia real, al aire libre y en biomas
  # con precipitación de lluvia (áridos/nieve/Nether/End excluidos).
  40:
    enabled: true
  50:
    enabled: true
  60:
    enabled: true
  70:
    enabled: true
  80:
    enabled: true
  90:
    enabled: true
  100:
    enabled: true

calendar:
  paused: false
  paused-at-epoch-millis: 0

# Temporada B1: calendario comprimido, roster cerrado y gates.
# La lista 'roster' es la fuente de verdad cuando existe (M = tamaño real).
# Sin lista se usa 'roster-size' solo para cálculos (sin inventar UUID ni
# enrolar a nadie) y el enforcement de login queda desactivado con aviso.
season:
  id: "temporada-1"
  length-days: 40
  roster: []
  roster-size: 16
  gate-percent: 40
  enforce-roster: true
  # Altar de sacrificios y cofre del Banco (B2): disponible desde el acto II.
  # Fijar con '/pd altar aqui' (requiere permadeath.admin); nunca sobreescribe
  # construcciones (si el bloque está ocupado, se rechaza). Vacío = sin fijar
  # (el menú funciona igual; el depósito exige cercanía solo si está fijado).
  altar:
    world: ""
    x: 0
    y: 64
    z: 0
  # Caída del Sol (B2): evento programado y acotado de Núcleos auténticos.
  # Un solo intento persistido en season-state.yml; sin fuego, bloques ni spam.
  solar-fall:
    enabled: true
    day: 30
    cores: 3
  # Recompensas pequeñas por objetivo (B1): se leen en cada arranque; si falta
  # una clave se conserva el default (1 esquirla) sin bloquear al administrador.
  rewards:
    PORTAL_RESERVA:
      currency: ESQUIRLAS
      amount: 1
    NOCHE_INSOMNE:
      currency: ESQUIRLAS
      amount: 1
    PRIMER_NUCLEO:
      currency: ESQUIRLAS
      amount: 1
    FORTALEZA:
      currency: ESQUIRLAS
      amount: 1
    CACERIA:
      currency: ESQUIRLAS
      amount: 1
    TRES_DIAS_DIEZMADOS:
      currency: ESQUIRLAS
      amount: 1
    BANCO_ANTES_DEL_FINAL:
      currency: ESQUIRLAS
      amount: 1
